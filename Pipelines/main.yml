trigger:
  branches:
    include:
      - main
      - development
pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: "Procaps-conexion"
  resourceGroup: "AZ-RG-PROCAPS-Dev-ServiciosCognitivos"
  containerAppName: "azcrprocapsdevservicios"
  acrName: "azcrprocapsdevservicios"
  acrLoginServer: "azcrprocapsdevservicios.azurecr.io"
  imageRepository: "deep-agents-procaps-template"
  imageTag: "$(Build.BuildId)"
  imageName: "$(acrLoginServer)/$(imageRepository):$(imageTag)"

stages:
  - stage: Build
    displayName: Build and Push
    jobs:
      - job: BuildAndPush
        displayName: Build Docker image and push to ACR
        steps:
          - task: AzureCLI@2
            displayName: Build and push image to ACR
            inputs:
              azureSubscription: "$(azureServiceConnection)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr login --name "$(acrName)"
                docker build -t "$(imageName)" -t "$(acrLoginServer)/$(imageRepository):latest" -f Dockerfile .
                docker push "$(imageName)"
                docker push "$(acrLoginServer)/$(imageRepository):latest"

  - stage: Deploy
    displayName: Deploy to Azure Container Apps
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DeployContainerApp
        displayName: Update Container App revision
        steps:
          - task: AzureCLI@2
            displayName: Deploy image to Azure Container App
            inputs:
              azureSubscription: "$(azureServiceConnection)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                echo "Deploying image: $(imageName)"

                az containerapp update \
                  --name "$(containerAppName)" \
                  --resource-group "$(resourceGroup)" \
                  --image "$(imageName)"
